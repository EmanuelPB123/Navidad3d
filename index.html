<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Navideña - Noche Profunda v2</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
    <script>
        // Sistema de nieve optimizado
        AFRAME.registerComponent('nieve-optimizada', {
            schema: { count: { type: 'int', default: 900 } },
            init: function () {
                this.snowflakes = [];
                for (let i = 0; i < this.data.count; i++) {
                    let flake = document.createElement('a-sphere');
                    flake.setAttribute('radius', '0.015');
                    flake.setAttribute('color', '#FFF');
                    flake.setAttribute('material', 'shader: flat; opacity: 0.7'); 
                    let pos = {
                        x: (Math.random() - 0.5) * 50,
                        y: Math.random() * 15,
                        z: (Math.random() - 0.5) * 50
                    };
                    flake.setAttribute('position', pos);
                    this.el.appendChild(flake);
                    this.snowflakes.push({ el: flake, pos: pos, speed: 0.02 + Math.random() * 0.04 });
                }
            },
            tick: function () {
                for (let i = 0; i < this.snowflakes.length; i++) {
                    const f = this.snowflakes[i];
                    f.pos.y -= f.speed;
                    if (f.pos.y < 0) f.pos.y = 15;
                    f.el.object3D.position.set(f.pos.x, f.pos.y, f.pos.z);
                }
            }
        });
        
        // Estrella superior (usa dos planos con textura SVG cruzados para un efecto 3D)
        AFRAME.registerComponent('star-top', {
            init: function () {
                const svg = `<?xml version="1.0" encoding="UTF-8"?><svg xmlns='http://www.w3.org/2000/svg' viewBox='-50 -50 100 100'><polygon points='0,-40 11,-12 40,-12 17,6 25,36 0,18 -25,36 -17,6 -40,-12 -11,-12' fill='#FFD700' stroke='#FFC000' stroke-width='4'/></svg>`;
                const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

                const plane1 = document.createElement('a-plane');
                plane1.setAttribute('width', '1.2');
                plane1.setAttribute('height', '1.2');
                plane1.setAttribute('material', `shader: flat; src: ${url}; transparent: true;`);
                plane1.setAttribute('rotation', '0 0 0');

                const plane2 = document.createElement('a-plane');
                plane2.setAttribute('width', '1.2');
                plane2.setAttribute('height', '1.2');
                plane2.setAttribute('material', `shader: flat; src: ${url}; transparent: true;`);
                plane2.setAttribute('rotation', '0 90 0');

                this.el.appendChild(plane1);
                this.el.appendChild(plane2);
            }
        });

        // Guirnalda de luces alrededor del pino (crea múltiples pequeñas esferas en espiral)
        AFRAME.registerComponent('guirnalda-luces', {
            schema: {
                count: { type: 'int', default: 60 },
                radius: { type: 'number', default: 2.8 },
                hstart: { type: 'number', default: 1 },
                hend: { type: 'number', default: 1.5 }
            },
            init: function () {
                const colors = ['#ff1744', '#ffea00', '#00e5ff', '#00e676', '#ff00e6', '#ff9100'];
                for (let i = 0; i < this.data.count; i++) {
                    const t = i / this.data.count;
                    const turns = 3.5;
                    const angle = t * turns * Math.PI * 2;
                    const y = this.data.hstart + t * (this.data.hend - this.data.hstart);
                    const r = this.data.radius * (1 - 0.4 * (y / this.data.hend));
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const bulb = document.createElement('a-sphere');
                    bulb.setAttribute('position', `${x} ${y} ${z}`);
                    bulb.setAttribute('radius', '0.08');
                    const color = colors[i % colors.length];
                    bulb.setAttribute('color', color);
                    bulb.setAttribute('material', `shader:flat; emissive:${color}; emissiveIntensity:2`);
                    bulb.setAttribute('animation', `property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: ${800 + (i % 5) * 120}; loop: true`);
                    this.el.appendChild(bulb);
                }
            }
        });

        // Componente que mueve partículas individuales de fuegos artificiales
        AFRAME.registerComponent('firework-particle', {
            schema: {
                vx: { type: 'number', default: 0 },
                vy: { type: 'number', default: 0 },
                vz: { type: 'number', default: 0 },
                life: { type: 'number', default: 1200 }
            },
            init: function () {
                this.age = 0;
            },
            tick: function (time, delta) {
                this.age += delta;
                const el = this.el;
                const p = el.object3D.position;
                p.x += this.data.vx * delta;
                p.y += this.data.vy * delta;
                p.z += this.data.vz * delta;
                // gravedad simple
                this.data.vy -= 0.00098 * delta;
                const remaining = Math.max(0, 1 - this.age / this.data.life);
                el.setAttribute('material', `opacity: ${remaining}`);
                if (this.age > this.data.life) {
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
        });

        // Fuegos artificiales: lanza explosiones periódicas en el cielo
        AFRAME.registerComponent('fuegos-artificiales', {
            schema: { interval: { type: 'number', default: 4000 } },
            init: function () {
                this.timer = 0;
            },
            tick: function (t, dt) {
                this.timer += dt;
                if (this.timer > this.data.interval + Math.random() * 2000) {
                    this.timer = 0;
                    this.launchFirework();
                }
            },
            launchFirework: function () {
                const scene = this.el.sceneEl;
                const x = (Math.random() - 0.5) * 10;
                const z = -8 + (Math.random() - 0.5) * 6;
                const y = 8 + Math.random() * 4;
                const particles = 25 + Math.floor(Math.random() * 35);
                const palette = ['#ff1744', '#ffea00', '#00e5ff', '#00e676', '#ff00e6', '#ff9100'];
                const color = palette[Math.floor(Math.random() * palette.length)];
                for (let i = 0; i < particles; i++) {
                    const p = document.createElement('a-sphere');
                    p.setAttribute('radius', `${0.05 + Math.random() * 0.06}`);
                    p.setAttribute('position', `${x} ${y} ${z}`);
                    p.setAttribute('material', `shader: flat; color: ${color}; emissive: ${color}; opacity: 1`);
                    const speed = 0.02 + Math.random() * 0.12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.random() * Math.PI;
                    const vx = Math.cos(theta) * Math.sin(phi) * speed;
                    const vz = Math.sin(theta) * Math.sin(phi) * speed;
                    const vy = Math.cos(phi) * speed;
                    p.setAttribute('firework-particle', `vx: ${vx}; vy: ${vy}; vz: ${vz}; life: ${800 + Math.random() * 1200}`);
                    scene.appendChild(p);
                }
            }
        });

        // Adornos: bolas y pequeños detalles en el pino
        AFRAME.registerComponent('adornos-pino', {
            schema: { count: { type: 'int', default: 24 } },
            init: function () {
                const colors = ['#D32F2F', '#1976D2', '#FBC02D', '#7B1FA2', '#00C853', '#FF6D00'];
                for (let i = 0; i < this.data.count; i++) {
                    const t = Math.random();
                    const y = 1 + t * 4.8; // entre hstart y hend
                    const spiral = (1 - (y / 5.8)) * 2.6;
                    const angle = Math.random() * Math.PI * 2 + t * 3.5 * Math.PI * 2;
                    const r = 0.6 + spiral * (1 - t * 0.5);
                    const x = Math.cos(angle) * r;
                    const z = Math.sin(angle) * r;
                    const ball = document.createElement('a-sphere');
                    const size = 0.09 + Math.random() * 0.06;
                    ball.setAttribute('radius', size.toFixed(3));
                    ball.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
                    const color = colors[i % colors.length];
                    ball.setAttribute('material', `shader: standard; color: ${color}; metalness: 0.9; roughness: 0.25; emissive: #000`);
                    // pequeño brillo pulsante
                    ball.setAttribute('animation', `property: scale; to: 1.25 1.25 1.25; dir: alternate; dur: ${900 + (i%4)*120}; loop: true`);
                    this.el.appendChild(ball);
                }
            }
        });

        // Luces en árboles de fondo
        AFRAME.registerComponent('tree-lights', {
            schema: { perTree: { type: 'int', default: 6 } },
            init: function () {
                const colors = ['#FFD600', '#00E5FF', '#FF4081'];
                const cones = this.el.querySelectorAll('a-cone');
                cones.forEach((cone, ci) => {
                    for (let i = 0; i < this.data.perTree; i++) {
                        const t = (i + 1) / (this.data.perTree + 1);
                        const bbox = cone.getAttribute('position');
                        const height = cone.getAttribute('height') || 8;
                        const rb = cone.getAttribute('radius-bottom') || 2;
                        const y = (t - 0.2) * height + (bbox ? bbox.y || 0 : 0);
                        const angle = Math.random() * Math.PI * 2;
                        const r = rb * (1 - t * 0.4);
                        const x = (bbox ? bbox.x || 0 : 0) + Math.cos(angle) * r;
                        const z = (bbox ? bbox.z || 0 : 0) + Math.sin(angle) * r;
                        const b = document.createElement('a-sphere');
                        b.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)}`);
                        b.setAttribute('radius', '0.06');
                        const color = colors[(ci + i) % colors.length];
                        b.setAttribute('material', `shader: flat; color: ${color}; emissive: ${color}; emissiveIntensity: 1.6`);
                        b.setAttribute('animation', `property: scale; to: 1.6 1.6 1.6; dir: alternate; dur: ${700 + (i%3)*140}; loop: true`);
                        cone.parentNode.appendChild(b);
                    }
                });
            }
        });

        // Luces en cadena entre postes/valla
        AFRAME.registerComponent('string-lights', {
            schema: { points: { type: 'int', default: 12 }, width: { type: 'number', default: 5.5 }, height: { type: 'number', default: 0.95 } },
            init: function () {
                const colors = ['#FFD54F', '#FF8A65', '#81C784', '#4FC3F7'];
                const half = this.data.width / 2;
                for (let i = 0; i < this.data.points; i++) {
                    const t = i / (this.data.points - 1);
                    const x = -half + t * this.data.width;
                    const y = this.data.height + Math.sin(t * Math.PI * 2) * 0.06;
                    const z = 0;
                    const bulb = document.createElement('a-sphere');
                    bulb.setAttribute('position', `${x.toFixed(3)} ${y.toFixed(3)} ${z}`);
                    bulb.setAttribute('radius', '0.06');
                    const color = colors[i % colors.length];
                    bulb.setAttribute('material', `shader: flat; color: ${color}; emissive: ${color}; emissiveIntensity: 1.8`);
                    bulb.setAttribute('animation', `property: position; to: ${x.toFixed(3)} ${ (y+0.06).toFixed(3)} ${z}; dir: alternate; dur: ${900 + (i%4)*110}; loop: true`);
                    this.el.appendChild(bulb);
                }
            }
        });

        // Decoraciones en regalos: cintas y lazo simple
        AFRAME.registerComponent('gift-decor', {
            init: function () {
                const children = this.el.querySelectorAll('a-box');
                children.forEach((box, i) => {
                    const pos = box.getAttribute('position') || { x:0, y:0, z:0 };
                    const sizeW = box.getAttribute('width') || 0.5;
                    const sizeD = box.getAttribute('depth') || 0.5;
                    const ribbon1 = document.createElement('a-box');
                    ribbon1.setAttribute('position', `${pos.x} ${ (pos.y + (box.getAttribute('height')||0)/2 + 0.01).toFixed(3) } ${pos.z}`);
                    ribbon1.setAttribute('width', `${sizeW}`);
                    ribbon1.setAttribute('height', '0.03');
                    ribbon1.setAttribute('depth', `${sizeD}`);
                    ribbon1.setAttribute('color', '#B71C1C');
                    this.el.appendChild(ribbon1);
                    const ribbon2 = document.createElement('a-box');
                    ribbon2.setAttribute('position', `${pos.x} ${ (pos.y + (box.getAttribute('height')||0)/2 + 0.02).toFixed(3) } ${pos.z}`);
                    ribbon2.setAttribute('width', '0.03');
                    ribbon2.setAttribute('height', `${(box.getAttribute('height')||0)}`);
                    ribbon2.setAttribute('depth', `${sizeD}`);
                    ribbon2.setAttribute('color', '#FDD835');
                    ribbon2.setAttribute('rotation', '0 45 0');
                    this.el.appendChild(ribbon2);
                });
            }
        });

        // Componente para evitar solapamientos: ajusta posiciones iniciales para separar objetos
        AFRAME.registerComponent('no-overlap', {
            schema: { iterations: { type: 'int', default: 40 }, padding: { type: 'number', default: 0.06 } },
            init: function () {
                // delay to allow other components to create children
                setTimeout(() => this.resolve(), 50);
            },
            resolve: function () {
                const ents = [];
                const candidates = this.el.querySelectorAll('a-box, a-sphere, a-cone, a-cylinder, a-torus, a-octahedron');
                candidates.forEach(el => {
                    // skip lights, camera, cursor
                    if (!el.getAttribute) return;
                    const posAttr = el.getAttribute('position') || { x: 0, y: 0, z: 0 };
                    const p = { x: +posAttr.x || 0, y: +posAttr.y || 0, z: +posAttr.z || 0 };
                    let r = 0.5;
                    const tag = el.tagName.toLowerCase();
                    if (tag === 'a-sphere') {
                        r = parseFloat(el.getAttribute('radius')) || r;
                    } else if (tag === 'a-box') {
                        const w = parseFloat(el.getAttribute('width')) || 0.5;
                        const h = parseFloat(el.getAttribute('height')) || 0.5;
                        const d = parseFloat(el.getAttribute('depth')) || 0.5;
                        r = 0.5 * Math.sqrt(w*w + h*h + d*d);
                    } else if (tag === 'a-cone') {
                        const rb = parseFloat(el.getAttribute('radius-bottom')) || 0.6;
                        const h = parseFloat(el.getAttribute('height')) || 1.0;
                        r = Math.max(rb, h*0.4);
                    } else if (tag === 'a-cylinder') {
                        const rad = parseFloat(el.getAttribute('radius')) || parseFloat(el.getAttribute('radius-top')) || 0.3;
                        const h = parseFloat(el.getAttribute('height')) || 1.0;
                        r = Math.max(rad, h*0.4);
                    } else if (tag === 'a-torus' || tag === 'a-octahedron') {
                        r = parseFloat(el.getAttribute('radius')) || 0.6;
                    }
                    ents.push({ el: el, p: p, r: r });
                });

                const iters = this.data.iterations;
                const pad = this.data.padding;
                for (let it = 0; it < iters; it++) {
                    let moved = false;
                    for (let i = 0; i < ents.length; i++) {
                        for (let j = i + 1; j < ents.length; j++) {
                            const a = ents[i];
                            const b = ents[j];
                            const dx = b.p.x - a.p.x;
                            const dy = b.p.y - a.p.y;
                            const dz = b.p.z - a.p.z;
                            const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.0001;
                            const minDist = a.r + b.r + pad;
                            if (dist < minDist) {
                                const overlap = (minDist - dist) / 2;
                                const ux = dx / dist;
                                const uy = dy / dist;
                                const uz = dz / dist;
                                // nudge both
                                a.p.x -= ux * overlap;
                                a.p.y -= uy * overlap;
                                a.p.z -= uz * overlap;
                                b.p.x += ux * overlap;
                                b.p.y += uy * overlap;
                                b.p.z += uz * overlap;
                                moved = true;
                            }
                        }
                    }
                    if (!moved) break;
                }

                // apply positions back to elements
                ents.forEach(item => {
                    item.el.setAttribute('position', `${item.p.x.toFixed(3)} ${item.p.y.toFixed(3)} ${item.p.z.toFixed(3)}`);
                });
            }
        });
    </script>
</head>
<body>
    <a-scene shadow="type: basic" fog="type: exponential; color: #000; density: 0.035">
        
        <!-- ENTORNO -->
        <a-entity environment="preset: snowy; skyType: color; skyColor: #000; horizonColor: #000; dressingAmount: 0; groundColor: #050505; grid: none"></a-entity>

        <a-assets>
            <audio id="jingle" src="Navidad en la Vereda.mp3"></audio>
        </a-assets>

        <!-- NIEVE -->
        <a-entity nieve-optimizada></a-entity>

        <!-- Entidad de sonido central: reproducirá el audio cargado en assets -->

              sound="src: #jingle; autoplay: true; loop: true; positional: true; volume: 1.5 ; distanceModel: inverse; maxDistance: 1000">
        </a-entity>

        <!-- LUCES -->

        <a-light type="point" color="#fff" intensity="0.4" position="0 5 -2"></a-light>

        <!-- TEXTO 3D EN LA ESCENA -->

                  animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 7.3 -8">
            <a-light type="point" color="#FFD700" intensity="0.5" distance="10"></a-light>
        </a-entity>

            <a-light type="point" color="#FFEB3B" intensity="0.35" distance="6"></a-light>
        </a-entity>
        <a-entity position="6 5 -3" rotation="0 -20 0" text="value: ¡Felices Fiestas!; align: center; color: #FF7043; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 3" animation="property: position; dir: alternate; dur: 2400; loop: true; to: 6 5.15 -3">
            <a-light type="point" color="#FF7043" intensity="0.35" distance="6"></a-light>
        </a-entity>
        <a-entity position="0 5 4" rotation="0 180 0" text="value: Alegría y Luz; align: center; color: #4FC3F7; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 3" animation="property: position; dir: alternate; dur: 2000; loop: true; to: 0 5.2 4">
            <a-light type="point" color="#4FC3F7" intensity="0.35" distance="6"></a-light>
        </a-entity>
        <a-entity position="0 5 -5" rotation="0 0 0" text="value: Paz en 2025; align: center; color: #C5E1A5; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 2.2" animation="property: position; dir: alternate; dur: 2600; loop: true; to: 0 5.1 -5">
            <a-light type="point" color="#C5E1A5" intensity="0.25" distance="6"></a-light>
        </a-entity>

        <!-- TEXTOS ARGENTINOS ADICIONALES -->
        <a-entity position="-8 4 -1" rotation="0 25 0" text="value: ¡Feliz Navidad, che!; align: center; color: #FFEB3B; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 2.5" animation="property: position; dir: alternate; dur: 2000; loop: true; to: -8 4.12 -1">
            <a-light type="point" color="#FFEB3B" intensity="0.32" distance="6"></a-light>
        </a-entity>
        <a-entity position="8 4 -1" rotation="0 -25 0" text="value: Que no falte el asado y la amistad; align: center; color: #FF8A65; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 3.5" animation="property: position; dir: alternate; dur: 2400; loop: true; to: 8 4.12 -1">
            <a-light type="point" color="#FF8A65" intensity="0.32" distance="6"></a-light>
        </a-entity>
        <a-entity position="-4 3.5 6" rotation="0 30 0" text="value: Abrazo grande desde el Sur; align: center; color: #90CAF9; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 2.8" animation="property: position; dir: alternate; dur: 2100; loop: true; to: -4 3.62 6">

        </a-entity>

            <a-light type="point" color="#C5E1A5" intensity="0.25" distance="6"></a-light>
        </a-entity>
        <a-entity position="-2 4 -4" rotation="0 15 0" text="value: Que el 2026 nos traiga esperanza; align: center; color: #FFD600; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 2.5" animation="property: position; dir: alternate; dur: 2300; loop: true; to: -2 4.12 -4">

        <a-entity position="2 4 -4" rotation="0 -15 0" text="value: ¡A celebrar con alegría, che!; align: center; color: #F48FB1; shader: msdf; font:https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/berkshireswash/BerkshireSwash-Regular.json; width: 2.5" animation="property: position; dir: alternate; dur: 2300; loop: true; to: 2 4.12 -4">

        <!-- BOSQUE DE PINOS DE FONDO -->
        <a-entity id="bosque" tree-lights>
            <a-cone color="#021a0a" position="-10 2 -20" radius-bottom="3" height="10"></a-cone>
            <a-cone color="#021a0a" position="12 2 -25" radius-bottom="3.5" height="12"></a-cone>
            <a-cone color="#053315" position="-18 1.5 -15" radius-bottom="2" height="8"></a-cone>
            <a-cone color="#053315" position="18 2 -18" radius-bottom="2.5" height="9"></a-cone>
        </a-entity>

        <!-- ESCENA CENTRAL -->
        <!-- BOSQUE ADICIONAL: más pinos alrededor de la escena para enriquecer el entorno -->
        <a-entity id="bosque2" tree-lights>
            <a-cone color="#073010" position="-6 1.2 -6" radius-bottom="1.6" height="3.2"></a-cone>
            <a-cone color="#053315" position="-3 1 -9" radius-bottom="1.8" height="3.8"></a-cone>
            <a-cone color="#0b3f1a" position="3 1 -9" radius-bottom="2" height="4.2"></a-cone>
            <a-cone color="#04250f" position="6 1.4 -6" radius-bottom="1.7" height="3.6"></a-cone>
            <a-cone color="#06321a" position="-7 1 -2" radius-bottom="1.4" height="3"></a-cone>
            <a-cone color="#0a4218" position="7 1 -2" radius-bottom="1.5" height="3.2"></a-cone>
            <a-cone color="#053315" position="-4 1 4" radius-bottom="1.2" height="2.8"></a-cone>
            <a-cone color="#06421a" position="4 1 5" radius-bottom="1.3" height="3"></a-cone>
            <a-cone color="#072b13" position="0 1 6" radius-bottom="1.6" height="3.2"></a-cone>
            <!-- Pequeños pinos cercanos al trineo y a la valla -->
            <a-cone color="#06321a" position="5 0.8 -8" radius-bottom="0.9" height="2.1"></a-cone>
            <a-cone color="#073010" position="-5 0.8 -7" radius-bottom="1" height="2.3"></a-cone>
        </a-entity>
        <a-entity position="0 0 -7">
            
            <!-- EL PINO PRINCIPAL -->
            <a-entity id="pino-navideno" adornos-pino="count:28">
                <a-cylinder color="#1a0f00" height="1" radius="0.35" position="0 0.5 0"></a-cylinder>
                <a-cone color="#04210e" radius-bottom="2.8" height="2.2" position="0 1.6 0"></a-cone>
                <a-cone color="#053315" radius-bottom="2.1" height="2" position="0 3.2 0"></a-cone>
                <a-cone color="#07441c" radius-bottom="1.5" height="1.8" position="0 4.6 0"></a-cone>
                <a-cone color="#0a5523" radius-bottom="0.9" height="1.4" position="0 5.8 0"></a-cone>

                <!-- ESTRELLA (ahora con forma de estrella SVG) -->
                <a-entity position="0 6.6 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
                    <a-entity star-top></a-entity>
                    <a-light type="point" intensity="2.2" distance="12" color="#FFD700"></a-light>
                </a-entity>

                <!-- Luces del árbol eliminadas por solicitud del usuario -->
            </a-entity>

            <!-- TREN NAVIDEÑO -->
            <a-entity id="tren" position="-2.5 0.2 3" rotation="0 90 0">
                <a-box width="0.8" height="0.5" depth="0.5" color="#B71C1C">
                    <a-cylinder position="0.3 0.3 0" radius="0.15" height="0.4" color="#333" rotation="0 0 0"></a-cylinder>
                    <!-- Ruedas de la locomotora: cuatro (dos a cada lado) -->
                    <a-cylinder position="0.28 -0.22 0.22" radius="0.12" height="0.08" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.28 -0.22 0.22" radius="0.12" height="0.08" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="0.28 -0.22 -0.22" radius="0.12" height="0.08" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.28 -0.22 -0.22" radius="0.12" height="0.08" color="#111" rotation="0 90 90"></a-cylinder>
                </a-box>
                <a-box position="-0.9 0 0" width="0.7" height="0.4" depth="0.4" color="#0D47A1">
                    <!-- Ruedas del primer vagón: cuatro, ajustadas en posición y tamaño -->
                    <a-cylinder position="0.24 -0.20 0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.24 -0.20 0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="0.24 -0.20 -0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.24 -0.20 -0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                </a-box>
                <a-box position="-1.7 0 0" width="0.7" height="0.4" depth="0.4" color="#1B5E20">
                    <!-- Ruedas del segundo vagón: cuatro, igual que el anterior -->
                    <a-cylinder position="0.24 -0.20 0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.24 -0.20 0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="0.24 -0.20 -0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                    <a-cylinder position="-0.24 -0.20 -0.20" radius="0.10" height="0.07" color="#111" rotation="0 90 90"></a-cylinder>
                </a-box>
            </a-entity>

            <!-- REGALOS (se han reubicado fuera del pino principal) -->
        </a-entity>

        <!-- REGALOS: fuera del pino principal para que no queden debajo del árbol -->
        <a-entity position="2.8 0 -3" >
            <a-box position="0 0.3 0" width="0.7" height="0.7" depth="0.7" color="#b00"></a-box>
            <a-box position="0.9 0.25 0.6" width="0.5" height="0.5" depth="0.5" color="#1565C0" rotation="0 45 0"></a-box>
            <a-box position="-0.7 0.15 0.8" width="0.4" height="0.4" depth="0.4" color="#f90"></a-box>
        </a-entity>

        <!-- MUÑECO DE NIEVE -->
        <a-entity position="-5 0 -4" rotation="0 45 0">
            <a-sphere position="0 0.6 0" radius="0.75" color="#fff"></a-sphere>
            <a-sphere position="0 1.6 0" radius="0.55" color="#fff"></a-sphere>
                <a-sphere position="0 2.4 0" radius="0.4" color="#fff">
                    <!-- Ojos más visibles y ligeramente hacia afuera -->
                    <a-sphere position="0.11 0.16 0.36" radius="0.06" color="#000"></a-sphere>
                    <a-sphere position="-0.11 0.16 0.36" radius="0.06" color="#000"></a-sphere>
                    <a-cone position="0 0 0.45" radius-bottom="0.06" height="0.3" rotation="90 0 0" color="#FF6D00"></a-cone>
                </a-sphere>
            <a-cylinder position="0 2.9 0" radius="0.45" height="0.05" color="#111"></a-cylinder>
            <a-cylinder position="0 3.3 0" radius="0.25" height="0.8" color="#111"></a-cylinder>
        </a-entity>

        <!-- BASTONES DE CARAMELO GIGANTES -->
        <a-entity position="6 0 -4" rotation="0 -30 0">
            <a-cylinder color="#fff" height="2.5" radius="0.18">
                <a-cylinder color="red" height="0.15" radius="0.19" position="0 0.8 0" material="shader:flat"></a-cylinder>
                <a-cylinder color="red" height="0.15" radius="0.19" position="0 0.3 0" material="shader:flat"></a-cylinder>
                <a-cylinder color="red" height="0.15" radius="0.19" position="0 -0.2 0" material="shader:flat"></a-cylinder>
            </a-cylinder>
            <a-torus color="#fff" radius="0.4" radius-tubular="0.18" arc="180" position="-0.4 1.25 0"></a-torus>
        </a-entity>

        <!-- FAROLAS -->
        <a-entity position="-4 0 3">
            <a-cylinder color="#111" height="3.5" radius="0.06"></a-cylinder>
            <a-box position="0 3.5 0" width="0.6" height="0.6" depth="0.6" color="#222">
                <a-sphere color="#fff" radius="0.25" material="shader:flat; emissive:#fff; emissiveIntensity:2">
                    <a-light type="point" intensity="1.2" distance="10" color="#fff"></a-light>
                </a-sphere>
            </a-box>
        </a-entity>

        <a-entity position="4 0 3">
            <a-cylinder color="#111" height="3.5" radius="0.06"></a-cylinder>
            <a-box position="0 3.5 0" width="0.6" height="0.6" depth="0.6" color="#222">
                <a-sphere color="#fff" radius="0.25" material="shader:flat; emissive:#fff; emissiveIntensity:2">
                    <a-light type="point" intensity="1.2" distance="10" color="#fff"></a-light>
                </a-sphere>
            </a-box>
        </a-entity>

        <!-- TRINEO -->
        <a-entity id="trineo" position="5 0.1 -10" rotation="0 -45 0">
            <a-box position="0 0 0.6" width="3" height="0.1" depth="0.1" color="#331a00"></a-box>
            <a-box position="0 0 -0.6" width="3" height="0.1" depth="0.1" color="#331a00"></a-box>
            <a-box position="0 0.5 0" width="2.2" height="0.8" depth="1.3" color="#900" shadow></a-box>
            <a-box position="0 1 0" width="1.4" height="0.6" depth="1.1" color="#060"></a-box>
        </a-entity>

        <!-- VALLA DE MADERA CON LUCES -->
        <a-entity position="0 0 6">
            <a-box position="-2.5 0.4 0" width="0.15" height="1" depth="0.15" color="#4a2c0f">
                <a-sphere position="0 0.55 0" radius="0.05" color="yellow" material="shader:flat; emissive:yellow; emissiveIntensity:1"></a-sphere>
            </a-box>
            <a-box position="0 0.4 0" width="0.15" height="1" depth="0.15" color="#4a2c0f">
                <a-sphere position="0 0.55 0" radius="0.05" color="yellow" material="shader:flat; emissive:yellow; emissiveIntensity:1"></a-sphere>
            </a-box>
            <a-box position="2.5 0.4 0" width="0.15" height="1" depth="0.15" color="#4a2c0f">
                <a-sphere position="0 0.55 0" radius="0.05" color="yellow" material="shader:flat; emissive:yellow; emissiveIntensity:1"></a-sphere>
            </a-box>
            <a-box position="0 0.6 0" width="5.5" height="0.1" depth="0.05" color="#4a2c0f"></a-box>
            <a-entity string-lights="points:14; width:5.5; height:0.95" position="0 0 0"></a-entity>
        </a-entity>

        <!-- CÁMARA -->
        <a-entity fuegos-artificiales></a-entity>
        <a-entity position="0 1.6 -1">
            <a-camera wasd-controls="acceleration: 100">
                <a-cursor color="#FFD700"></a-cursor>
            </a-camera>
        </a-entity>

    </a-scene>
</body>
</html>
